<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BikeGlide</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/navbar.css">
    <link rel="stylesheet" href="../css/auth.css">
    <link rel="stylesheet" href="../css/flip-card.css">
</head>
<body>

    <nav class="navbar" id="navbar">
        <div class="container">
            <a href="../home.html" class="nav-logo">BikeGlide</a>

            <button type="button" id="nav-hamburger-btn" class="nav-hamburger" aria-label="Toggle navigation" aria-expanded="false">
                <span></span>
                <span></span>
                <span></span>
            </button>

            <div class="nav-menu" id="nav-menu">
                <div class="nav-center">
                    <a href="../home.html">Home</a>
                    <a href="bikes.html">Browse Bikes</a>
                    <a href="about.html">About Us</a>
                    <a href="contact.html">Contact</a>
                </div>
                <div class="nav-right">
                    <a href="signin.html" class="nav-signin active">Sign In</a>
                </div>
            </div>
        </div>
    </nav>

    <main class="flip-page" aria-label="Sign in or create an account">

        <div class="wrapper">
            <div class="card-switch" id="card-switch">

                <button type="button" class="switch" id="auth-toggle-btn" aria-label="Switch between Sign In and Sign Up" aria-pressed="false">
                    <span class="slider"></span>
                    <span class="card-side"></span>
                </button>

                <div class="flip-inner">

                    <div class="flip-front">
                        <p class="title">Sign In</p>

                        <form class="flip-form" action="#" method="post" novalidate
                              aria-label="Sign in form">

                            <div class="form-group">
                                <label for="login-email">Email Address</label>
                                <input
                                    class="flip-input"
                                    id="login-email"
                                    name="email"
                                    type="email"
                                    placeholder="you@example.com"
                                    required
                                    autocomplete="email"
                                >
                            </div>

                            <div class="form-group">
                                <label for="login-password">Password</label>
                                <input
                                    class="flip-input"
                                    id="login-password"
                                    name="password"
                                    type="password"
                                    placeholder="Enter your password"
                                    required
                                    minlength="8"
                                    autocomplete="current-password"
                                >
                            </div>

                            <div class="captcha-row">
                                <div class="captcha-display" aria-label="CAPTCHA security code">
                                    <span class="captcha-code" aria-live="polite">7K9P2</span>
                                </div>
                                <input
                                    class="flip-input captcha-input"
                                    id="login-captcha"
                                    name="captcha"
                                    type="text"
                                    placeholder="Enter captcha"
                                    required
                                    maxlength="10"
                                    autocomplete="off"
                                    aria-label="Enter the CAPTCHA code shown above"
                                >
                            </div>

                            <div class="form-links">
                                <div class="checkbox-row" style="margin-bottom:0;">
                                    <input type="checkbox" id="remember-me" name="remember_me">
                                    <label for="remember-me">Remember me</label>
                                </div>
                                <a href="#" class="form-link">Forgot Password?</a>
                            </div>

                            <button class="flip-btn" type="submit">Sign In</button>

                            <div class="auth-divider">OR</div>

                            <a href="#" class="google-btn"
                               aria-label="Sign in with Google (UI only — functionality planned for future phase)">
                                <svg class="google-icon" viewBox="0 0 24 24"
                                     xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                                    <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
                                    <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                                    <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"/>
                                    <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
                                </svg>
                                Sign in with Google
                            </a>

                        </form>
                    </div>
                    <div class="flip-back">
                        <p class="title">Sign Up</p>

                        <form class="flip-form" action="#" method="post" novalidate
                              aria-label="Create account form">

                            <div class="form-group">
                                <label for="signup-name">Full Name</label>
                                <input
                                    class="flip-input"
                                    id="signup-name"
                                    name="name"
                                    type="text"
                                    placeholder="Your full name"
                                    required
                                    minlength="3"
                                    autocomplete="name"
                                >
                            </div>

                            <div class="form-group">
                                <label for="signup-email">Email Address</label>
                                <input
                                    class="flip-input"
                                    id="signup-email"
                                    name="email"
                                    type="email"
                                    placeholder="you@example.com"
                                    required
                                    autocomplete="email"
                                >
                            </div>

                            <div class="form-group">
                                <label for="signup-phone">Phone Number</label>
                                <input
                                    class="flip-input"
                                    id="signup-phone"
                                    name="phone"
                                    type="tel"
                                    placeholder="+91 XXXXX XXXXX"
                                    required
                                    pattern="[6-9][0-9]{9}"
                                    maxlength="10"
                                    autocomplete="tel"
                                >
                            </div>

                            <div class="form-group">
                                <label for="signup-password">Password</label>
                                <input
                                    class="flip-input"
                                    id="signup-password"
                                    name="password"
                                    type="password"
                                    placeholder="Min. 8 characters"
                                    required
                                    minlength="8"
                                    autocomplete="new-password"
                                >
                            </div>

                            <div class="form-group">
                                <label for="signup-confirm">Confirm Password</label>
                                <input
                                    class="flip-input"
                                    id="signup-confirm"
                                    name="confirm_password"
                                    type="password"
                                    placeholder="Repeat password"
                                    required
                                    minlength="8"
                                    autocomplete="new-password"
                                >
                            </div>

                            <div class="form-group">
                                <label for="signup-city">City</label>
                                <select class="flip-input flip-select"
                                        id="signup-city" name="city" required>
                                    <option value="" disabled selected>Select your city</option>
                                    <option value="chandigarh">Chandigarh</option>
                                    <option value="mohali">Mohali</option>
                                    <option value="delhi">Delhi</option>
                                    <option value="manali">Manali</option>
                                    <option value="goa">Goa</option>
                                    <option value="other">Other</option>
                                </select>
                            </div>

                            <div class="checkbox-row">
                                <input type="checkbox" id="signup-terms" name="terms" required>
                                <label for="signup-terms">
                                    I agree to the <a href="#">Terms</a> &amp; <a href="#">Privacy Policy</a>
                                </label>
                            </div>

                            <button class="flip-btn" type="submit">Create Account</button>

                        </form>
                    </div>
                    </div>
                </div>
            </div>
        </main>

    <script src="../js/main.js"></script>
</body>
</html>
